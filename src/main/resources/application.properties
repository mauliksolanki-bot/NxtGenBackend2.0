# -----------------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------------
spring.application.name=nxtgen-api
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# -----------------------------------------------------------------------------
# Oracle Database
# Use DB_URL, DB_USERNAME, and DB_PASSWORD environment variables in deployed
# environments. The values after ':' are local-development defaults.
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//MaulikSolanki:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:SYSTEM}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# -----------------------------------------------------------------------------
# Flyway database migrations
# Migrations execute automatically each time the application starts.
# -----------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# SYSTEM is an Oracle-managed, non-empty schema. Baseline it at version 0 so
# Flyway can initialize tracking there and still execute every NxtGen script
# beginning with V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=NxtGen Oracle schema baseline
# Flyway records every migration in this Oracle table. Its installed_by column
# captures the authenticated database user that applied each change.
spring.flyway.table=WF_DATABASE_SCHEMA_HISTORY
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

# -----------------------------------------------------------------------------
# Cross-origin requests
# Add approved UI origins as a comma-separated list through CORS_ORIGINS.
# -----------------------------------------------------------------------------
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}

# -----------------------------------------------------------------------------
# JWT authentication
# JWT_SECRET must be at least 32 characters. Override it outside local use.
# -----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:replace-this-with-a-32-character-minimum-production-secret}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# -----------------------------------------------------------------------------
# Logging
# Limit console output to errors in all environments.
# -----------------------------------------------------------------------------
logging.level.root=ERROR
logging.level.com.nxtgen=INFO
logging.threshold.console=ERROR
